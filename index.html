<!DOCTYPE html>
<html lang="tr">
<head>
 <meta charset="UTF-8">
 <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
 <meta name="theme-color" content="#120b2a">
 <meta name="description" content="Falcı Gacı ile falına baktır — Kahve Falı, Yüz Falı, Tarot, El Falı, Rüya Yorumu ve daha fazlası.">
 <meta property="og:title" content="Falcı Gacı — Fal Sonucun">
 <meta property="og:description" content="Senin için fal yorumlandı. Falcı Gacı ile sen de falına baktır.">
 <meta property="og:type" content="website">
 <meta property="og:image" content="https://hakan039.github.io/kahve-falcisi/logo.png">
 <meta name="twitter:card" content="summary_large_image">
 <title>Fal Sonucun | Falcı Gacı</title>
 <style>
    :root {
      --bg-deep: #0a0618;
      --bg-card: #1a1232;
      --bg-card-2: #221744;
      --gold: #ffc857;
      --gold-soft: #ffd98a;
      --gold-glow: rgba(255, 200, 87, 0.35);
      --purple-mist: #3d1b58;
      --text: #fffaf0;
      --text-soft: #e9d7f3;
      --text-muted: #b9a9c9;
      --border-gold: rgba(255, 200, 87, 0.4);
      --border-soft: rgba(255, 200, 87, 0.18);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html { scroll-behavior: smooth; }

    body {
      min-height: 100vh;
      background:
        radial-gradient(ellipse at top, var(--purple-mist) 0%, var(--bg-deep) 55%),
        var(--bg-deep);
      color: var(--text);
      font-family: Georgia, 'Times New Roman', serif;
      line-height: 1.6;
      padding: 24px 16px 64px;
      padding-top: max(24px, env(safe-area-inset-top));
      padding-bottom: max(64px, env(safe-area-inset-bottom));
      -webkit-font-smoothing: antialiased;
    }

    /* Yıldız efekti arka plan */
    .stars {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      background-image:
        radial-gradient(1px 1px at 20% 30%, rgba(255,255,255,0.6), transparent),
        radial-gradient(1px 1px at 60% 70%, rgba(255,200,87,0.5), transparent),
        radial-gradient(1px 1px at 80% 20%, rgba(255,255,255,0.4), transparent),
        radial-gradient(1px 1px at 30% 80%, rgba(255,200,87,0.4), transparent),
        radial-gradient(2px 2px at 90% 50%, rgba(255,255,255,0.3), transparent),
        radial-gradient(1px 1px at 10% 60%, rgba(255,255,255,0.5), transparent),
        radial-gradient(1px 1px at 50% 10%, rgba(255,200,87,0.4), transparent),
        radial-gradient(1px 1px at 70% 90%, rgba(255,255,255,0.3), transparent);
      background-size: 100% 100%;
      opacity: 0.7;
      animation: twinkle 4s ease-in-out infinite alternate;
    }
    @keyframes twinkle { from { opacity: 0.45; } to { opacity: 0.8; } }

    main {
      position: relative;
      z-index: 1;
      width: min(720px, 100%);
      margin: 0 auto;
      background: linear-gradient(180deg, var(--bg-card) 0%, var(--bg-card-2) 100%);
      border: 1px solid var(--border-gold);
      border-radius: 22px;
      box-shadow: 0 24px 60px rgba(8, 3, 17, 0.7), 0 0 0 1px rgba(255,200,87,0.08);
      overflow: hidden;
    }

    /* Header */
    header {
      text-align: center;
      padding: 40px 24px 32px;
      border-bottom: 1px solid var(--border-soft);
      background:
        radial-gradient(circle at 50% 0%, rgba(255,200,87,0.12), transparent 60%);
    }
    .logo-wrap {
      width: 92px;
      height: 92px;
      margin: 0 auto 16px;
      border-radius: 50%;
      border: 2px solid var(--gold);
      box-shadow: 0 0 32px var(--gold-glow), inset 0 0 24px rgba(255,200,87,0.2);
      overflow: hidden;
      background: radial-gradient(circle, var(--bg-card-2), var(--bg-deep));
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .logo-wrap img { width: 100%; height: 100%; object-fit: cover; }
    .logo-fallback {
      font-size: 40px;
      filter: drop-shadow(0 0 12px var(--gold-glow));
    }
    h1 {
      color: var(--gold);
      font-size: 30px;
      font-weight: 700;
      letter-spacing: 0.5px;
      text-shadow: 0 0 24px var(--gold-glow);
    }
    #tur {
      margin-top: 10px;
      color: var(--text-soft);
      font-size: 17px;
      font-style: italic;
    }
    .divider {
      width: 60px;
      height: 2px;
      margin: 18px auto 0;
      background: linear-gradient(90deg, transparent, var(--gold), transparent);
    }

    /* Fal metni */
    section {
      padding: 32px 28px;
    }
    #yorum {
      white-space: pre-wrap;
      font-size: 17px;
      line-height: 1.85;
      color: var(--text);
      text-align: justify;
    }
    #yorum:empty::before,
    .loading::before {
      content: "Fal sonucu yükleniyor... 🔮";
      display: block;
      text-align: center;
      color: var(--text-muted);
      font-style: italic;
      padding: 40px 0;
    }

    /* İndir kartı */
    footer {
      border-top: 1px solid var(--border-soft);
      padding: 32px 28px 36px;
      text-align: center;
      background: linear-gradient(180deg, transparent, rgba(61, 27, 88, 0.25));
    }
    .cta-text { color: var(--text-soft); margin-bottom: 18px; font-size: 15px; }
    .cta-text strong { color: var(--gold); }
    .store-btn {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 15px 30px;
      background: linear-gradient(135deg, var(--gold) 0%, var(--gold-soft) 100%);
      color: #160825;
      font-family: system-ui, -apple-system, sans-serif;
      font-weight: 800;
      font-size: 16px;
      text-decoration: none;
      border-radius: 14px;
      box-shadow: 0 10px 30px rgba(255, 200, 87, 0.3);
      transition: transform 0.15s ease, box-shadow 0.0.2s ease;
    }
    .store-btn:hover { transform: translateY(-2px); box-shadow: 0 14px 36px rgba(255,200,87,0.45); }
    .store-btn:active { transform: translateY(0); }
    .store-btn svg { width: 22px; height: 22px; flex-shrink: 0; }

    .footer-note {
      margin-top: 22px;
      color: var(--text-muted);
      font-size: 12.5px;
      line-height: 1.6;
    }

    /* Paylaş butonu (sayfada direkt paylaşım) */
    .share-row { margin-top: 20px; display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
    .share-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 10px 18px;
      background: rgba(255,200,87,0.08);
      color: var(--gold);
      border: 1px solid var(--border-soft);
      border-radius: 12px;
      font-family: system-ui, sans-serif;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s;
    }
    .share-btn:hover { background: rgba(255,200,87,0.16); }

    @media (max-width: 520px) {
      body { padding: 12px 8px 48px; }
      header { padding: 32px 18px 24px; }
      .logo-wrap { width: 76px; height: 76px; }
      h1 { font-size: 25px; }
      section { padding: 24px 18px; }
      #yorum { font-size: 16px; line-height: 1.8; }
      footer { padding: 24px 18px 28px; }
      .store-btn { padding: 13px 22px; font-size: 15px; }
    }
 </style>
</head>
<body>
 <div class="stars"></div>
 <main>
    <header>
      <div class="logo-wrap">
        <img src="logo.png" alt="Falcı Gacı logo" onerror="this.style.display='none';this.nextElementSibling.style.display='flex'">
        <span class="logo-fallback" style="display:none">🔮</span>
      </div>
      <h1>Falcı Gacı</h1>
      <p id="tur">Fal sonucun</p>
      <div class="divider"></div>
    </header>
    <section>
      <p id="yorum"></p>
    </section>
    <footer>
      <p class="cta-text">Sen de falına baktırmak için <strong>Falcı Gacı</strong>'yı indir.</p>
      <a class="store-btn" href="https://play.google.com/store" rel="noopener" target="_blank">
        <svg viewBox="0 0 512 512" fill="currentColor"><path d="M325.3 234.3 104.6 13l280.8 161.2-60.1 60.1zM47 0C34 6.8 25.3 19.2 25.3 35.3v441.3c0 16.1 8.7 28.5 21.7 35.3l256.6-256L47 0zm425.2 225.6-58.9-34.1-65.7 64.5 65.7 64.5 60.1-34.1c18-14.3 18-46.5-1.2-60.8zM104.6 499l220.7-221.3 60.1 60.1L104.6 499z"/></svg>
        Google Play'den İndir
      </a>
      <div class="share-row">
        <button class="share-btn" onclick="sayfayiPaylas()">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><line x1="8.59" y1="13.51" x2="15.42" y2="17.49"/><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"/></svg>
          Bu Falı Paylaş
        </button>
      </div>
      <p class="footer-note">Bu fal eğlence amaçlıdır. Falcı Gacı ile kahve falı, yüz falı, el falı, tarot, rüya yorumu ve daha fazlası.</p>
    </footer>
 </main>

 <script>
    const params = new URLSearchParams(window.location.search);
    const tur = params.get('tur');
    const yorum = params.get('yorum');
    const yorumEl = document.getElementById('yorum');
    const turEl = document.getElementById('tur');

    if (tur) {
      turEl.textContent = tur;
      document.title = tur + ' | Falcı Gacı';
    }
    if (yorum) {
      yorumEl.textContent = decodeURIComponent(yorum);
    } else {
      yorumEl.className = 'loading';
    }

    function sayfayiPaylas() {
      const url = window.location.href;
      if (navigator.share) {
        navigator.share({ title: 'Falcı Gacı - ' + (tur || 'Fal Sonucun'), url: url }).catch(()=>{});
      } else {
        navigator.clipboard?.writeText(url);
        alert('Paylaşım bağlantısı kopyalandı!');
      }
    }
 </script>
</body>
</html>
